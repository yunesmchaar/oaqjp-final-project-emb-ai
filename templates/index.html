<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Emotion Detector</h1>
        <p>Enter a statement to detect its emotions.</p>
        <div class="form-group">
            <textarea id="textToAnalyze" class="form-control" rows="4" placeholder="Type your text here"></textarea>
        </div>
        <button class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
        <div id="system_response" class="mt-4"></div>
    </div>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
